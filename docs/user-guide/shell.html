<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111111">
  <title>Back Kitchen 使用说明</title>
  <style>
    :root {
      --background: #111111;
      --card: #1A1A1A;
      --border: #2E2E2E;
      --foreground: #FFFFFF;
      --muted: #B8B9B6;
      --primary: #FF8400;
      --primary-hover: #CC6A00;
      --error: #FF5C33;
      --error-bg: #24100B;
      --success: #B6FFCE;
      --success-bg: #222924;
      --warning-bg: #291C0F;
      --info: #B2B2FF;
      --info-bg: #222229;
      --sidebar: 304px;
      --rail: 220px;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Geist, "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--sans); font-size: 14px; line-height: 1.72; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    .app-shell { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; z-index: 30; }
    .brand { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 16px 20px; background: var(--card); border-bottom: 1px solid var(--border); font: 700 15px/1 var(--mono); letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--background); font-size: 13px; }
    .brand small { display: block; margin-top: 7px; color: var(--muted); font: 400 11px/1 var(--sans); letter-spacing: 0; }
    .search-wrap { padding: 16px 18px 8px; }
    .search-wrap label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .search-wrap input { width: 100%; height: 40px; padding: 10px 16px; color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: 999px; outline: none; }
    .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .search-empty { display: none; margin: 12px 18px; padding: 12px; color: var(--muted); border: 1px solid var(--border); }
    .nav { padding: 8px 12px 28px; }
    .nav-group { margin-top: 18px; }
    .nav-group h2 { margin: 0 8px 7px; color: var(--muted); font: 600 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .nav-item { display: grid; grid-template-columns: 30px 1fr; align-items: center; min-height: 38px; padding: 8px 10px; border: 1px solid transparent; text-decoration: none; font: 500 12px/1.45 var(--mono); }
    .nav-item span { color: var(--muted); font-size: 10px; }
    .nav-item:hover { color: var(--primary); background: var(--background); border-color: var(--border); }
    .nav-item.active { color: var(--background); background: var(--primary); }
    .nav-item.active span { color: var(--background); }
    .nav-item[hidden], .nav-group[hidden] { display: none; }

    .topbar { position: fixed; top: 0; right: 0; left: var(--sidebar); z-index: 20; display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 28px; background: var(--background); border-bottom: 1px solid var(--border); }
    .breadcrumb { color: var(--muted); font: 500 12px/1 var(--mono); }
    .breadcrumb strong { color: var(--foreground); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .chapter-count { min-width: 72px; color: var(--muted); font: 500 12px/1 var(--mono); text-align: right; }
    .menu-button, .print-button { height: 40px; padding: 0 16px; color: var(--foreground); background: var(--card); border: 1px solid var(--border); border-radius: 999px; font: 500 12px/1 var(--mono); cursor: pointer; }
    .menu-button { display: none; }
    .menu-button:hover, .print-button:hover { border-color: var(--primary); color: var(--primary); }

    .content-shell { margin-left: var(--sidebar); padding: 112px calc(var(--rail) + 48px) 64px 48px; }
    .guide-page { width: min(900px, 100%); margin: 0 auto; animation: page-in .32s ease both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .article-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .article-kicker { margin: 0 0 8px; color: var(--primary); font: 600 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .article-header h1 { margin: 0; font: 700 clamp(25px, 4vw, 38px)/1.22 var(--mono); letter-spacing: -.035em; }
    .copy-link, .article-pagination button { flex: none; height: 40px; padding: 0 16px; color: var(--foreground); background: var(--card); border: 1px solid var(--border); border-radius: 999px; font: 500 12px/1 var(--mono); cursor: pointer; }
    .copy-link:hover, .article-pagination button:hover { color: var(--primary); border-color: var(--primary); }
    .copy-link.copied { color: var(--success); background: var(--success-bg); }

    .article-body > :first-child { margin-top: 0; }
    .article-body h2 { margin: 44px 0 14px; padding-top: 12px; font: 600 18px/1.35 var(--mono); scroll-margin-top: 92px; }
    .article-body h2::before { content: ""; display: inline-block; width: 18px; height: 3px; margin: 0 10px 5px 0; background: var(--primary); }
    .article-body h3 { margin: 28px 0 10px; font: 600 14px/1.45 var(--mono); }
    .article-body p { margin: 0 0 14px; color: var(--foreground); }
    .article-body ul, .article-body ol { margin: 0 0 18px; padding-left: 24px; }
    .article-body li { margin: 6px 0; }
    .article-body li::marker { color: var(--primary); font-family: var(--mono); }
    .article-body strong { color: var(--foreground); }
    .article-body a { color: var(--primary); text-underline-offset: 4px; }
    .article-body blockquote { margin: 20px 0; padding: 14px 16px; color: var(--muted); background: var(--warning-bg); border-left: 3px solid var(--primary); }
    .article-body blockquote p:last-child { margin-bottom: 0; }
    .article-body pre { overflow-x: auto; margin: 18px 0; padding: 18px; background: var(--background); border: 1px solid var(--border); font: 12px/1.65 var(--mono); }
    .article-body code { padding: 2px 5px; background: var(--card); border: 1px solid var(--border); font: 12px/1.4 var(--mono); }
    .article-body pre code { padding: 0; background: none; border: 0; }
    .article-body img { display: block; width: 100%; height: auto; margin: 24px 0 30px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 12px 40px rgba(0,0,0,.18); }
    .table-scroll { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--border); }
    .article-body table { width: 100%; min-width: 580px; border-collapse: collapse; background: var(--card); }
    .article-body th, .article-body td { padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    .article-body th { color: var(--foreground); background: var(--background); font: 600 12px/1.4 var(--mono); }
    .article-body td { color: var(--foreground); }
    .article-body tr:last-child td { border-bottom: 0; }

    .article-pagination { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); }
    .article-pagination span { color: var(--muted); font: 500 11px/1 var(--mono); }
    .article-pagination button:disabled { opacity: .35; cursor: not-allowed; }

    .toc { position: fixed; top: 104px; right: 24px; width: var(--rail); max-height: calc(100vh - 128px); overflow-y: auto; padding-left: 16px; border-left: 1px solid var(--border); }
    .toc h2 { margin: 0 0 12px; color: var(--muted); font: 600 11px/1.4 var(--mono); letter-spacing: .08em; }
    .toc a { display: block; padding: 5px 0; color: var(--muted); font-size: 12px; line-height: 1.45; text-decoration: none; }
    .toc a:hover { color: var(--primary); }
    .toc-empty { color: var(--muted); font-size: 12px; }

    .overlay { display: none; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.65); }

    @media (max-width: 1180px) {
      :root { --rail: 0px; }
      .toc { display: none; }
      .content-shell { padding-right: 40px; }
    }

    @media (max-width: 820px) {
      .sidebar { transform: translateX(-100%); transition: transform .22s ease; }
      .sidebar.open { transform: translateX(0); }
      .overlay.open { display: block; }
      .topbar { left: 0; padding: 0 16px; }
      .menu-button { display: inline-flex; align-items: center; }
      .print-button { display: none; }
      .content-shell { margin-left: 0; padding: 96px 18px 48px; }
      .article-header { align-items: flex-start; }
      .copy-link { padding-inline: 12px; }
      .chapter-count { display: none; }
    }

    @media (max-width: 560px) {
      .article-header { display: block; }
      .copy-link { margin-top: 18px; }
      .article-pagination button { padding-inline: 12px; }
      .article-body img { margin-inline: -18px; width: calc(100% + 36px); border-left: 0; border-right: 0; }
    }

    @media print {
      body { background: var(--background); color: var(--foreground); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .sidebar, .topbar, .toc, .overlay, .article-pagination, .copy-link { display: none !important; }
      .content-shell { margin: 0; padding: 0; }
      .guide-page { display: block !important; width: 100%; break-after: page; animation: none; }
      .article-body img { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="使用说明目录">
      <div class="brand"><span class="brand-mark">BK</span><span>BACK KITCHEN<small>USER GUIDE / 用户说明</small></span></div>
      <div class="search-wrap">
        <label for="guide-search">搜索章节</label>
        <input id="guide-search" type="search" placeholder="输入关键词…" autocomplete="off">
      </div>
      <p class="search-empty" id="search-empty">没有匹配的章节。</p>
      <nav class="nav"><!-- @NAV --></nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <header class="topbar">
      <div class="top-actions">
        <button class="menu-button" id="menu-button" type="button" aria-expanded="false">目录</button>
        <p class="breadcrumb">HELP / <strong id="breadcrumb-title">Back Kitchen 使用说明</strong></p>
      </div>
      <div class="top-actions">
        <span class="chapter-count" id="chapter-count">01 / 16</span>
        <button class="print-button" type="button" onclick="window.print()">打印全部</button>
      </div>
    </header>

    <main class="content-shell"><!-- @MAIN --></main>

    <aside class="toc" aria-label="本页目录">
      <h2>本页目录</h2>
      <div id="toc-links"></div>
    </aside>
  </div>

  <script>
    const PAGE_ORDER = ['home', 'overview', 'getting-started', 'roles', 'notifications', 'issues-and-versions', 'producer-circles', 'producer-albums', 'producer-workflow', 'producer-intake', 'producer-approval', 'producer-final-review', 'composer-submission', 'composer-peer-review', 'composer-revision', 'mastering'];
    const pages = [...document.querySelectorAll('[data-page]')];
    const navItems = [...document.querySelectorAll('[data-nav-page]')];
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menu-button');
    const breadcrumbTitle = document.getElementById('breadcrumb-title');
    const chapterCount = document.getElementById('chapter-count');
    const tocLinks = document.getElementById('toc-links');
    const search = document.getElementById('guide-search');
    const searchEmpty = document.getElementById('search-empty');

    function currentId() {
      const id = location.hash.slice(1).split('/')[0];
      return PAGE_ORDER.includes(id) ? id : PAGE_ORDER[0];
    }

    function slugify(value, index) {
      return `section-${index + 1}-${value.toLowerCase().replace(/[^a-z0-9一-鿿]+/g, '-').replace(/^-|-$/g, '')}`;
    }

    function buildToc(page) {
      const headings = [...page.querySelectorAll('.article-body h2')];
      tocLinks.innerHTML = '';
      if (!headings.length) {
        tocLinks.innerHTML = '<p class="toc-empty">本页没有二级标题。</p>';
        return;
      }
      headings.forEach((heading, index) => {
        if (!heading.id) heading.id = slugify(heading.textContent, index);
        const link = document.createElement('a');
        link.href = `#${currentId()}/${heading.id}`;
        link.textContent = heading.textContent;
        link.addEventListener('click', event => {
          event.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', `#${currentId()}/${heading.id}`);
        });
        tocLinks.appendChild(link);
      });
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      menuButton.setAttribute('aria-expanded', 'false');
    }

    function render() {
      const requestedId = location.hash.slice(1).split('/')[0];
      const id = currentId();
      if (requestedId !== id) history.replaceState(null, '', `#${id}`);
      const pageIndex = PAGE_ORDER.indexOf(id);
      const page = pages.find(item => item.dataset.page === id);
      pages.forEach(item => item.hidden = item !== page);
      navItems.forEach(item => item.classList.toggle('active', item.dataset.navPage === id));
      breadcrumbTitle.textContent = page.dataset.title;
      chapterCount.textContent = `${String(pageIndex + 1).padStart(2, '0')} / ${String(PAGE_ORDER.length).padStart(2, '0')}`;
      page.querySelector('[data-prev]').disabled = pageIndex === 0;
      page.querySelector('[data-next]').disabled = pageIndex === PAGE_ORDER.length - 1;
      page.querySelector('[data-prev]').onclick = () => { location.hash = PAGE_ORDER[pageIndex - 1]; };
      page.querySelector('[data-next]').onclick = () => { location.hash = PAGE_ORDER[pageIndex + 1]; };
      buildToc(page);
      closeSidebar();
      const sectionId = location.hash.slice(1).split('/')[1];
      if (sectionId) {
        requestAnimationFrame(() => document.getElementById(sectionId)?.scrollIntoView({ block: 'start' }));
      } else {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      document.title = `${page.dataset.title} · Back Kitchen 使用说明`;
    }

    document.addEventListener('click', event => {
      const copyButton = event.target.closest('[data-copy-link]');
      if (!copyButton) return;
      navigator.clipboard?.writeText(location.href).then(() => {
        copyButton.textContent = '已复制';
        copyButton.classList.add('copied');
        setTimeout(() => { copyButton.textContent = '复制链接'; copyButton.classList.remove('copied'); }, 1400);
      });
    });

    search.addEventListener('input', () => {
      const term = search.value.trim().toLowerCase();
      let visibleCount = 0;
      document.querySelectorAll('.nav-group').forEach(group => {
        let groupVisible = 0;
        group.querySelectorAll('.nav-item').forEach(item => {
          const visible = !term || item.dataset.search.toLowerCase().includes(term);
          item.hidden = !visible;
          if (visible) groupVisible += 1;
        });
        group.hidden = groupVisible === 0;
        visibleCount += groupVisible;
      });
      searchEmpty.style.display = visibleCount ? 'none' : 'block';
    });

    menuButton.addEventListener('click', () => {
      const open = !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', open);
      overlay.classList.toggle('open', open);
      menuButton.setAttribute('aria-expanded', String(open));
    });
    overlay.addEventListener('click', closeSidebar);
    window.addEventListener('hashchange', render);

    if (!location.hash || !PAGE_ORDER.includes(location.hash.slice(1).split('/')[0])) {
      history.replaceState(null, '', `#${PAGE_ORDER[0]}`);
    }
    render();
  </script>
</body>
</html>
